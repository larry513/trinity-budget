<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trinity Budget">
<title>Trinity’s UofT Budget · 多倫多大學生活預算</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M26,3 L31,3 L27.5,17 L23.5,17 Z' fill='%23ff8fb8'/%3E%3Cpath d='M11,18 Q24,7 37,18 Z' fill='%23fff' stroke='%235b4a5e' stroke-width='2'/%3E%3Cpath d='M12,20 L36,20 L33,43 Q24,46 15,43 Z' fill='%23f7dcc2' stroke='%235b4a5e' stroke-width='2'/%3E%3Ccircle cx='19' cy='38' r='2.6' fill='%235a3a35'/%3E%3Ccircle cx='25' cy='40' r='2.6' fill='%235a3a35'/%3E%3Ccircle cx='30' cy='36' r='2.6' fill='%235a3a35'/%3E%3C/svg%3E">
<style>
:root{--ink:#3e3242;--muted:#86788a;--glass:rgba(255,255,255,.8);--glass2:rgba(255,255,255,.62);--line:rgba(120,80,120,.13);--pri:#d4578f;--pri2:#ec8db6;--acc:#9b7bea;--acc2:#b9a2f3;--mint:#5fbf9a;--amber:#d98b06;--amberbg:#fff3d6;--red:#e04a5f;--redbg:#ffe3e8;--green:#2f9e7a;--greenbg:#ddf5ea;--lav:#efe8ff;--pink:#ffe6f0;--r:22px;--shadow:0 8px 26px rgba(150,80,130,.13);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(180deg,#ffe3ef 0%,#f1eaff 40%,#e6f7f0 100%) fixed;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.42;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(155,123,234,.55);outline-offset:2px}
.en{color:var(--muted);font-weight:500;font-size:.86em}
.zh{color:var(--muted);font-weight:400;font-size:.88em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.neg{color:var(--red)!important}
.pos{color:var(--green)}
.warnc{color:#a96a00}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0}
/* hero */
.hero{position:relative;height:calc(250px + var(--sat));overflow:hidden;border-radius:0 0 30px 30px;box-shadow:0 10px 30px rgba(160,90,140,.18)}
.hero svg.scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.topbar{position:absolute;top:calc(10px + var(--sat));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:5}
.brand{background:var(--glass2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:6px 12px 7px;border-radius:16px;border:1px solid rgba(255,255,255,.7);min-width:0}
.brand h1{font-size:16px;margin:0;line-height:1.2;letter-spacing:.2px;color:#b03f76}
.brand .sub{font-size:11.5px;color:var(--muted)}
.scenechip{display:inline-block;margin-top:3px;font-size:11px;background:rgba(255,255,255,.9);border-radius:10px;padding:1px 8px}
.monthsel{display:flex;align-items:center;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:2px;border:1px solid rgba(255,255,255,.7);flex-shrink:0}
.monthsel button{background:none;border:0;width:36px;height:40px;font-size:20px;border-radius:12px;color:var(--pri)}
.monthsel button:hover{background:rgba(212,87,143,.08)}
.monthsel label{position:relative;display:block;text-align:center;min-width:78px;font-weight:800;font-size:14px;line-height:1.1;padding:3px 2px}
.monthsel label small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.monthsel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
main{padding:12px 12px calc(98px + var(--sab));position:relative;z-index:4;max-width:1500px;margin:0 auto}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.85);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:#6b3f6a}
.card h3 .right,.card h2 .right{margin-left:auto}
.linkbtn{background:none;border:0;color:var(--pri);font-weight:700;padding:6px 4px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:10px 14px;min-height:44px;font-weight:700;background:#fff;box-shadow:0 1px 3px rgba(120,60,100,.08);border:1px solid var(--line)}
.btn:hover{border-color:var(--pri2)}
.btn.pri{background:linear-gradient(135deg,var(--pri),#e77fae);color:#fff;border-color:transparent}
.btn.acc{background:linear-gradient(135deg,var(--acc),#c0a6f7);color:#fff;border-color:transparent}
.btn.danger{background:#fff;color:var(--red);border-color:#f6c0c9}
.btn.dangerfill{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn-add{width:100%;margin-top:12px;min-height:56px;font-size:18px;letter-spacing:.5px;border-radius:18px;background:linear-gradient(135deg,#f06aa5,#b98cf2);color:#fff;border:0;font-weight:900;box-shadow:0 8px 18px rgba(212,87,143,.33)}
.btn-add:active,.qchip:active,.cchip:active{transform:scale(.97)}
/* hello card */
.hello-top{display:flex;align-items:flex-end;gap:10px}
.mbox{flex-shrink:0;line-height:0}
.mascot{display:block}
.bubble{position:relative;background:#fff;border:1.5px solid #f4c6dc;border-radius:18px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:26px;box-shadow:0 3px 10px rgba(212,87,143,.1)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-left:1.5px solid #f4c6dc;border-bottom:1.5px solid #f4c6dc;transform:rotate(45deg)}
.leftbig{margin-top:2px}
.leftbig label{font-size:13px;color:var(--muted);font-weight:700}
.leftbig .big{font-size:40px;font-weight:900;letter-spacing:-.5px;line-height:1.1;color:var(--pri)}
.leftbig .sub{font-size:12px;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.tile{background:rgba(255,255,255,.78);border-radius:16px;padding:9px 12px;border:1px solid var(--line);text-align:left;width:100%}
.tile label{display:block;font-size:12px;color:var(--muted);cursor:inherit}
.tile b{font-size:19px;display:block}
.tile small{font-size:11.5px;color:var(--muted)}
button.tile:hover{border-color:var(--pri2)}
.rentinfo{display:flex;align-items:center;gap:10px;margin-top:10px;background:linear-gradient(135deg,#fff4fa,#f4efff);border:1px dashed #e7b6d2;border-radius:16px;padding:9px 12px;font-size:13.5px}
.bar{height:10px;background:#f1e6ef;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#8fd8b8,#5fbf9a);max-width:100%}
.bar.fat{height:16px;margin-top:8px}
.bar.warn i{background:linear-gradient(90deg,#ffd27a,#f5a524)}
.bar.over i{background:linear-gradient(90deg,#ff8fa0,#e04a5f)}
/* quick chips */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:#fff;border:1px solid var(--line);border-radius:16px;font-weight:800;font-size:12.5px;line-height:1.15;min-height:78px}
.qchip small{font-weight:500;font-size:10px;color:var(--muted)}
.qchip:hover{border-color:var(--pri2);background:#fff7fb}
.qchip.boba{grid-column:span 2;flex-direction:row;justify-content:center;gap:10px;background:linear-gradient(135deg,#fff1e4,#ffe6f0);border-color:#f3c9a6;font-size:15px}
.qchip.boba .ico{width:44px;height:44px}
/* boba */
.bobacard{background:linear-gradient(160deg,rgba(255,241,228,.95),rgba(255,230,240,.9));border-color:#f7d7bf}
.boba-row{display:flex;align-items:center;gap:10px}
.cups{font-size:15px;font-weight:800;color:#8a5a3c}
.cups b{font-size:44px;line-height:1;color:#b0623b}
.bobaamt{font-size:13px;color:var(--muted)}.bobaamt b{color:var(--ink);font-size:17px}
.mom{font-size:12.5px;margin-top:4px}
.cupline{display:flex;flex-wrap:wrap;gap:2px;margin:8px 0 4px;min-height:28px;align-items:center}
.cupline .more{font-weight:800;color:#b0623b;margin-left:4px}
.boba-add{width:100%;background:#fff;border-color:#f3c9a6;color:#a0522d;font-size:16px;min-height:48px}
/* status */
.totrow{display:flex;justify-content:space-between;font-weight:800;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.alert{border-radius:14px;padding:9px 12px;font-weight:700;font-size:13.5px;margin:8px 0}
.alert.over{background:var(--redbg);color:#b3263c;border:1px solid #f6b9c3}
.alert.warn{background:var(--amberbg);color:#94600a}
.alert.ok{background:var(--greenbg);color:var(--green)}
.prow{padding:9px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.prow .top .n{font-weight:700;display:flex;align-items:center;gap:7px;min-width:0}
.prow .top .n>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .bot{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.note{font-size:12px;color:#6b5a70;background:rgba(239,232,255,.7);border-radius:10px;padding:5px 9px;margin-top:6px;display:flex;align-items:center;gap:6px}
.subchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.subchip{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 8px 2px 4px;font-size:12px}
.subchip.zero{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:700}
.chip.warn{background:var(--amberbg);border-color:#f3d48f}
.chip.over{background:var(--redbg);border-color:#f2b6b0}
.badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:7px;padding:1px 6px;vertical-align:middle;line-height:1.5}
.badge.ok{background:var(--greenbg);color:var(--green)}
.badge.warn{background:var(--amberbg);color:#9a6200}
.badge.over{background:var(--redbg);color:var(--red)}
.badge.inc{background:#ddf5ea;color:#24785c}
.badge.kind{background:var(--lav);color:#6b4fb8}
/* jar */
.jarcard{background:linear-gradient(160deg,rgba(255,250,228,.95),rgba(239,232,255,.92));border-color:#efe0a9}
.jar-row{display:flex;align-items:center;gap:6px}
.jar{flex-shrink:0}
.big2{font-size:30px;font-weight:900;color:#a0791a;line-height:1.1}
/* lists */
.elist{list-style:none;margin:0;padding:0}
.eitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.eitem:hover{background:rgba(255,255,255,.7)}
.eitem:last-child{border-bottom:0}
.icw{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.eitem .m{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .a{font-weight:900;text-align:right}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:13.5px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px 4px 5px;font-size:12.5px;font-weight:700;min-height:34px}
.fchip.on{background:var(--pink);border-color:var(--pri2);color:#a8326b}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--sab))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;font-size:11px;color:var(--muted);border-radius:14px;font-weight:700}
.nav button .i{line-height:0}
.nav button.on{color:var(--pri)}
.nav button.on .i{transform:scale(1.1)}
.nav button.addnav .i{width:56px;height:56px;margin-top:-24px;border-radius:50%;background:linear-gradient(135deg,#f06aa5,#b98cf2);color:#fff;display:grid;place-items:center;font-size:32px;line-height:1;box-shadow:0 6px 14px rgba(212,87,143,.4);border:3px solid #fff}
.nav button.addnav{color:var(--pri)}
.fab{display:none;position:fixed;right:28px;bottom:28px;z-index:41;border:0;border-radius:30px;height:60px;padding:0 24px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#f06aa5,#b98cf2);box-shadow:0 10px 24px rgba(212,87,143,.4)}
/* forms */
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid #e3d2df;border-radius:13px;padding:9px 12px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(236,141,182,.22)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amtwrap{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #ead3e2;border-radius:18px;padding:4px 14px;margin:2px 0 8px}
.amtwrap:focus-within{border-color:var(--pri)}
.amtwrap .cur{font-size:28px;font-weight:800;color:var(--muted)}
.amtwrap input{border:0;outline:none;font-size:34px;font-weight:900;width:100%;min-width:0;background:transparent;padding:4px 0}
.amtwrap .code{font-size:13px;color:var(--muted);font-weight:800}
.seg{display:flex;background:#f6eaf2;border-radius:14px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:40px;font-size:13.5px;padding:4px 6px;line-height:1.15;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(150,60,110,.15);color:var(--pri)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;background:#fff;border:2px solid #f0e3ec;border-radius:16px;font-weight:800;font-size:12px;line-height:1.15;min-height:72px}
.cchip small{font-weight:500;font-size:9.5px;color:var(--muted)}
.cchip.on{border-color:var(--pri);background:#fff0f7;box-shadow:0 0 0 3px rgba(212,87,143,.15)}
.cchip.boba{background:linear-gradient(160deg,#fff6ee,#fff)}
.cchip.boba.on{background:#fff0f7}
.qamts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.qa{border:1px solid #ead3e2;background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;min-height:36px}
.qa:hover{border-color:var(--pri)}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:#fff;border:1px solid #e3d2df;min-height:44px;cursor:pointer;font-size:13.5px}
.check input{width:20px;height:20px;accent-color:var(--pri)}
.live{border-radius:16px;padding:10px;margin:8px 0 12px;background:#fbf6fa;border:1px solid var(--line)}
.live:empty{display:none}
.live .g{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.live .g div{background:#fff;border-radius:11px;padding:6px 10px}
.live .g label{display:block;font-size:11px;color:var(--muted)}
.live .g b{font-size:16px}
.status{margin-top:8px;border-radius:13px;padding:9px 12px;font-weight:800;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.status.ok{background:var(--greenbg);color:var(--green)}
.status.warn{background:var(--amberbg);color:#9a6200}
.status.over{background:var(--red);color:#fff}
.status.info{background:#ddf5ea;color:#24785c;font-weight:700}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin:2px 0}
/* modal */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(60,30,60,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fffafd;width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s ease-out;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:#fffafd;margin:-14px -16px 10px;padding:14px 16px 8px;z-index:3;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:17px;color:#6b3f6a}
.xbtn{width:40px;height:40px;border-radius:50%;border:0;background:#f6e6ef;font-size:20px}
.sheet .foot{position:sticky;bottom:calc(-18px - var(--sab));background:#fffafd;padding:10px 0 4px;margin-top:6px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet .foot .btn{flex:1;min-height:52px;font-size:16px}
#confirmLayer .modal-back{z-index:80;align-items:center;padding:20px}
.dialog{background:#fff;border-radius:22px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 8px}
.dialog p{margin:0 0 14px;color:var(--muted);white-space:pre-line}
.dialog .btnrow .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sab));transform:translateX(-50%);background:#5b3a5e;color:#fff;padding:10px 16px;border-radius:16px;z-index:90;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px) scale(.95);opacity:0}}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{font-weight:900;border-top:2px solid var(--line)}
.tbl tr.proj td{background:rgba(239,232,255,.5);font-style:italic}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* budget editor */
.bl{border-bottom:1px solid var(--line);padding:10px 0}
.bl:last-of-type{border-bottom:0}
.bl .r1{display:grid;grid-template-columns:34px 1fr 104px;grid-template-areas:"ic zh amt" "ic en amt";gap:6px 8px;align-items:center}
.bl .r1 .ico{grid-area:ic}
.bl .r1 [data-lf=zh]{grid-area:zh}.bl .r1 [data-lf=en]{grid-area:en;min-height:36px;font-size:13.5px;color:var(--muted)}.bl .r1 [data-lf=amount]{grid-area:amt;text-align:right;font-weight:800}
.bl .r1 .inp{min-height:40px;font-size:15px;padding:7px 10px}
.bl .r2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.bl .r2 .bar{flex:1;min-width:80px;margin:0}
.iconpick{display:flex;gap:3px;flex-wrap:wrap}
.ipk{border:1px solid var(--line);background:#fff;border-radius:9px;padding:2px;line-height:0}
.ipk.on{border-color:var(--pri);background:#fff0f7}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.stat label{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:18px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:#86788a;font-family:inherit}
@media (max-width:700px){.chart text{font-size:17px}}
.reptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.reptools select{max-width:260px}
.rh{margin:16px 0 6px!important;font-size:15px!important}
.rstats{margin-top:12px}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:28px minmax(90px,1.1fr) 2fr auto;gap:8px;align-items:center;font-size:13px}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ht{height:12px;background:#f3e8f0;border-radius:7px;overflow:hidden}
.ht i{display:block;height:100%;background:linear-gradient(90deg,#ffb3c8,#c7a6ff);border-radius:7px}
textarea.summary{width:100%;white-space:pre-wrap;font-family:inherit;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:320px;line-height:1.5}
.about{display:block}.about .mascot{float:right;margin-left:8px}
.view{display:none}
.view.on{display:block}
#printArea{display:none}
.home-grid>.col{min-width:0}
@media (min-width:700px){
  .stats4{grid-template-columns:repeat(4,1fr)}
  .modal-back{align-items:center;padding:20px}
  .sheet{border-radius:24px;max-height:90vh}
  .sheet .foot{bottom:-18px}
  .cgrid{grid-template-columns:repeat(6,1fr)}
}
@media (min-width:760px){
  .hero{height:300px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .reports-grid,.budget-grid,.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .span2,.span3{grid-column:1/-1}
  .bl .r1{grid-template-columns:34px 1fr 1fr 120px;grid-template-areas:"ic zh en amt"}
  .bl .r1 [data-lf=en]{min-height:40px}
}
@media (min-width:1024px){
  .hero{height:360px;border-radius:0 0 38px 38px}
  .topbar{left:24px;right:24px;top:18px}
  .brand{padding:10px 16px}
  .brand h1{font-size:22px}
  .brand .sub{font-size:13px}
  .nav{top:18px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:auto;display:flex;gap:2px;border-radius:20px;border:1px solid rgba(255,255,255,.8);padding:4px;background:rgba(255,255,255,.82);box-shadow:var(--shadow)}
  .nav button{flex-direction:row;gap:6px;min-height:42px;padding:0 14px;font-size:14px}
  .nav button .i .ico{width:24px;height:24px}
  .nav button.addnav{display:none}
  .fab{display:block}
  main{padding:18px 24px 40px;margin-top:-40px}
  .home-grid{grid-template-columns:minmax(320px,1fr) minmax(340px,1.1fr) minmax(300px,1fr);gap:16px}
  .reports-grid{grid-template-columns:2fr 1fr;gap:16px}
  .reports-grid .span2{grid-column:span 1}
  .budget-grid{grid-template-columns:1.6fr 1fr;gap:16px}
  .more-grid{grid-template-columns:1fr 1fr 1fr;gap:16px}
  .toast{bottom:30px}
  .qgrid{grid-template-columns:repeat(4,1fr)}
}
/* scene animations */
.anim-bob{animation:bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim-ripple{animation:ripple 6s linear infinite}
.anim-cloud{animation:cloud 60s linear infinite}
.anim-twinkle{animation:twinkle 1.8s ease-in-out infinite}
.anim-burst{animation:burst 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.anim-sway{animation:sway 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
.anim-tail{animation:tail 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 10%}
.mascot-cheer .tri{animation:hop 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes ripple{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@keyframes cloud{0%{transform:translateX(0)}100%{transform:translateX(-200px)}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes burst{0%{transform:scale(.1);opacity:0}10%{opacity:1}60%{transform:scale(1);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 3px rgba(255,255,255,.8);animation:fall linear infinite}
.leaf,.heart,.petal{position:absolute;top:-30px;animation:fallspin linear infinite}
@keyframes fall{to{transform:translate(30px,400px)}}
@keyframes fallspin{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-30px,200px) rotate(200deg)}100%{transform:translate(20px,420px) rotate(400deg)}}
.heart{animation-name:floatup;top:auto;bottom:-30px}
@keyframes floatup{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.9}100%{transform:translateY(-330px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flake,.leaf,.heart,.petal{display:none}}
/* print → PDF report */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;font-size:12px}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#3e3242}
  #printArea .phead{display:flex;align-items:center;gap:14px;border-bottom:3px solid #ffc2d9;padding-bottom:8px;margin-bottom:10px}
  #printArea .phead h1{margin:0;font-size:22px;color:#b03f76}
  #printArea .phead>.ico{margin-left:auto}
  #printArea .stats4{grid-template-columns:repeat(4,1fr)}
  #printArea .stat{border:1px solid #eadbe5;background:#fff}
  #printArea .tbl{font-size:11.5px}
  #printArea .tbl tr{break-inside:avoid}
  #printArea .hb{grid-template-columns:24px 160px 1fr 80px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
/* ===================== ART: Toronto scene, Trinity mascot, kawaii icons (inline SVG) ===================== */
var Art = (function(){
  'use strict';
  var NAMES={christmas:'🎄 Merry Christmas 聖誕快樂',newyear:'🎆 Happy New Year 新年快樂',canadaday:'🇨🇦 Happy Canada Day 加拿大日快樂',thanksgiving:'🦃 Happy Thanksgiving 感恩節快樂',halloween:'🎃 Happy Halloween 萬聖節快樂',valentine:'💕 Valentine’s Day 情人節快樂',lunarnewyear:'🧧 Happy Lunar New Year 新年快樂',midautumn:'🥮 Mid-Autumn Festival 中秋節快樂',victoriaday:'🌸 Victoria Day 維多利亞日',familyday:'💗 Family Day 家庭日',none:''};
  function pad(n){return (n<10?'0':'')+n;}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function addDays(d,k){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);return x;}
  function between(t,a,b){return t>=ymd(a)&&t<=ymd(b);}
  function nthWeekday(y,m0,wd,n){var d=new Date(y,m0,1);var off=(wd-d.getDay()+7)%7;return new Date(y,m0,1+off+(n-1)*7);}
  function victoriaDay(y){var d=new Date(y,4,24);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d;}
  function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  var LUNAR_NY={2025:'2025-01-29',2026:'2026-02-17',2027:'2027-02-06',2028:'2028-01-26',2029:'2029-02-13',2030:'2030-02-03'};
  var MID_AUTUMN={2025:'2025-10-06',2026:'2026-09-25',2027:'2027-09-15',2028:'2028-10-03',2029:'2029-09-22',2030:'2030-09-12'};
  var LIST=Object.keys(NAMES);
  function detect(d){
    var y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate(),t=ymd(d);
    if(LUNAR_NY[y]){var l=pd(LUNAR_NY[y]);if(between(t,addDays(l,-1),addDays(l,3)))return 'lunarnewyear';}
    if(md>=1227||md<=103)return 'newyear';
    if(md>=1125&&md<=1226)return 'christmas';
    if(md>=1030&&md<=1031)return 'halloween';
    var tg=nthWeekday(y,9,1,2);if(between(t,addDays(tg,-1),tg))return 'thanksgiving';
    if(MID_AUTUMN[y]){var m=pd(MID_AUTUMN[y]);if(between(t,addDays(m,-1),addDays(m,1)))return 'midautumn';}
    if(md>=630&&md<=701)return 'canadaday';
    if(md>=213&&md<=214)return 'valentine';
    var vd=victoriaDay(y);if(between(t,addDays(vd,-1),vd))return 'victoriaday';
    var fd=nthWeekday(y,1,1,3);if(between(t,addDays(fd,-1),fd))return 'familyday';
    return 'none';
  }
  function current(){
    var q={};try{q=Object.fromEntries(new URLSearchParams(location.search));}catch(e){}
    if(q.scene&&LIST.indexOf(q.scene)>=0)return q.scene; // hidden dev override
    var d=new Date();
    if(q.date&&/^\d{4}-\d{2}-\d{2}$/.test(q.date))d=pd(q.date); // hidden dev override (scene only)
    return detect(d);
  }
  // seeded random for deterministic layout
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  function star(cx,cy,r,f){var p='';for(var i=0;i<10;i++){var a=Math.PI/5*i-Math.PI/2,rr=i%2?r*0.45:r;p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);}return '<path d="'+p+'Z" fill="'+f+'"/>';}
  function maple(cx,cy,s,f){ // simple maple leaf shape
    var d='M0,-10 L2,-5 5,-7 4,-2 9,-3 7,1 10,3 4,4 5,8 1,6 1,10 -1,10 -1,6 -5,8 -4,4 -10,3 -7,1 -9,-3 -4,-2 -5,-7 -2,-5Z';
    return '<path d="'+d+'" fill="'+f+'" transform="translate('+cx+','+cy+') scale('+s+')"/>';
  }
  function pumpkin(x,y,s,face){
    var g='<g transform="translate('+x+','+y+') scale('+s+')"><path d="M0,-22 q2,-8 7,-9" stroke="#3f6b2a" stroke-width="3" fill="none" stroke-linecap="round"/>';
    g+='<ellipse cx="-9" cy="-10" rx="10" ry="11" fill="#e8761f"/><ellipse cx="9" cy="-10" rx="10" ry="11" fill="#e8761f"/><ellipse cx="0" cy="-10" rx="11" ry="12" fill="#f28c28"/>';
    if(face)g+='<path d="M-8,-14l3,-4 3,4zM2,-14l3,-4 3,4zM-8,-6 q8,6 16,0 l-3,1 -2,-2 -2,2 -2,-2 -2,2 -2,-2z" fill="#4a2a0a"/>';
    return g+'</g>';
  }
  function lantern(x,y,s){return '<g class="anim-sway" transform="translate('+x+','+y+') scale('+s+')"><path d="M0,-30 v10" stroke="#7a3b1a" stroke-width="1.5"/><rect x="-7" y="-21" width="14" height="4" rx="1" fill="#f5c542"/><ellipse cx="0" cy="-6" rx="13" ry="13" fill="#e63a2e"/><path d="M-6,-17 q-4,11 0,22 M6,-17 q4,11 0,22 M0,-19v26" stroke="#c22a20" stroke-width="1" fill="none"/><rect x="-7" y="5" width="14" height="4" rx="1" fill="#f5c542"/><path d="M-3,9v9M0,9v11M3,9v9" stroke="#f5c542" stroke-width="1.2"/></g>';}
  function burst(cx,cy,r,col,delay){
    var s='<g class="anim-burst" style="animation-delay:'+delay+'s">';
    for(var i=0;i<14;i++){var a=i/14*Math.PI*2;s+='<line x1="'+(cx+Math.cos(a)*r*0.3).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r*0.3).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r).toFixed(1)+'" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round"/><circle cx="'+(cx+Math.cos(a)*r*1.08).toFixed(1)+'" cy="'+(cy+Math.sin(a)*r*1.08).toFixed(1)+'" r="2" fill="'+col+'"/>';}
    return s+'</g>';
  }
  function heart(x,y,s,f){return '<path transform="translate('+x+','+y+') scale('+s+')" d="M0,6 C-8,-1 -10,-6 -6,-9 C-3,-11 0,-8 0,-6 C0,-8 3,-11 6,-9 C10,-6 8,-1 0,6Z" fill="'+f+'"/>';}
  function gift(x,y,w,c1,c2){return '<g><rect x="'+(x-w/2)+'" y="'+(y-w*0.8)+'" width="'+w+'" height="'+(w*0.8)+'" rx="2" fill="'+c1+'"/><rect x="'+(x-w/2-2)+'" y="'+(y-w*0.95)+'" width="'+(w+4)+'" height="'+(w*0.2)+'" rx="2" fill="'+c1+'"/><rect x="'+(x-2.5)+'" y="'+(y-w*0.95)+'" width="5" height="'+(w*0.95)+'" fill="'+c2+'"/><path d="M'+x+','+(y-w*0.95)+' q-9,-9 -10,0 z M'+x+','+(y-w*0.95)+' q9,-9 10,0 z" fill="'+c2+'"/></g>';}
  function fx(scene){
    var h='',i;
    var leafSVG=function(c){return '<svg width="18" height="18" viewBox="-11 -11 22 22">'+maple(0,0,1,c)+'</svg>';};
    if(scene==='christmas'||scene==='lunarnewyear'&&false){for(i=0;i<46;i++){var sz=2+Math.random()*4;h+='<i class="flake" style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;animation-duration:'+(6+Math.random()*8).toFixed(1)+'s;animation-delay:-'+(Math.random()*12).toFixed(1)+'s"></i>';}}
    if(scene==='thanksgiving'||scene==='halloween'){var cols=['#e2572f','#f08a2c','#d63a2a','#f5b041'];for(i=0;i<(scene==='halloween'?8:16);i++){h+='<span class="leaf" style="left:'+(Math.random()*100).toFixed(1)+'%;animation-duration:'+(8+Math.random()*8).toFixed(1)+'s;animation-delay:-'+(Math.random()*14).toFixed(1)+'s;transform:scale('+(0.7+Math.random()*0.8).toFixed(2)+')">'+leafSVG(cols[i%4])+'</span>';}}
    if(scene==='valentine'||scene==='familyday'){for(i=0;i<12;i++){h+='<span class="heart" style="left:'+(Math.random()*100).toFixed(1)+'%;animation-duration:'+(6+Math.random()*6).toFixed(1)+'s;animation-delay:-'+(Math.random()*10).toFixed(1)+'s"><svg width="18" height="18" viewBox="-11 -11 22 18">'+heart(0,0,1.3,['#ff6fa3','#ff8fb1','#e5466e'][i%3])+'</svg></span>';}}
    if(scene==='victoriaday'){for(i=0;i<12;i++){h+='<span class="petal" style="left:'+(Math.random()*100).toFixed(1)+'%;animation-duration:'+(8+Math.random()*6).toFixed(1)+'s;animation-delay:-'+(Math.random()*10).toFixed(1)+'s"><svg width="10" height="10" viewBox="0 0 10 10"><ellipse cx="5" cy="5" rx="5" ry="3" fill="#ffb3c8"/></svg></span>';}}
    return h;
  }
  /* ---------- kawaii icons (48x48) ---------- */
  var OL='#5b4a5e';
  function face(cx,cy,k){k=k||1;return '<g stroke="none"><circle cx="'+(cx-4.6*k)+'" cy="'+cy+'" r="'+(1.7*k)+'" fill="'+OL+'"/><circle cx="'+(cx+4.6*k)+'" cy="'+cy+'" r="'+(1.7*k)+'" fill="'+OL+'"/><ellipse cx="'+(cx-7.6*k)+'" cy="'+(cy+3*k)+'" rx="'+(2.2*k)+'" ry="'+(1.4*k)+'" fill="#ff8fb1" opacity=".75"/><ellipse cx="'+(cx+7.6*k)+'" cy="'+(cy+3*k)+'" rx="'+(2.2*k)+'" ry="'+(1.4*k)+'" fill="#ff8fb1" opacity=".75"/></g><path d="M'+(cx-2*k)+','+(cy+2.4*k)+' q'+(2*k)+','+(2.2*k)+' '+(4*k)+',0" fill="none" stroke="'+OL+'" stroke-width="1.4"/>';}
  function spark(x,y,r,f){return '<path d="M'+x+','+(y-r)+' Q'+x+','+y+' '+(x+r)+','+y+' Q'+x+','+y+' '+x+','+(y+r)+' Q'+x+','+y+' '+(x-r)+','+y+' Q'+x+','+y+' '+x+','+(y-r)+'Z" fill="'+(f||'#ffd84d')+'" stroke="none"/>';}
  var ICONS={
    boba:'<path d="M26,3 L31,3 L27.5,17 L23.5,17 Z" fill="#ff8fb8"/><path d="M11,18 Q24,7 37,18 Z" fill="#fff"/><rect x="9.5" y="16.5" width="29" height="4.5" rx="2.2" fill="#ffc2d9"/><path d="M12,21 L36,21 L33,42 Q24,45.5 15,42 Z" fill="#f7dcc2"/>'+[[18,38],[23,40.5],[28.5,38.5],[31,34.5],[16.5,33.5],[25,35.5],[20.5,35]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.3" fill="#5a3a35" stroke="none"/>';}).join('')+face(24,28,.85),
    groc:'<circle cx="31" cy="13" r="7" fill="#9bd88f"/><path d="M31,6 v-3 M28,7 l-2,-3" fill="none"/><circle cx="17" cy="15" r="6.5" fill="#ff8a8a"/><path d="M17,8.5 l-2,-2 M17,8.5 l2,-2" stroke="#4f9a54" fill="none"/><path d="M22,5 L28,20 L19,20 Z" fill="#ffb86b"/><path d="M12,20 Q24,1 36,20" fill="none"/><path d="M5,20 H43 L38,42 Q24,45 10,42 Z" fill="#f5d3a8"/><path d="M8,26 H40 M9.5,32 H38.5" fill="none" stroke="#d8ad7c" stroke-width="1.2"/>'+face(24,33,.85),
    eat:'<path d="M17,10 q-3,-3 0,-6 M24,10 q-3,-3 0,-6 M31,10 q-3,-3 0,-6" fill="none" stroke="#c9bfe0"/><path d="M30,4 L40,20 M35,3 L43,19" fill="none" stroke="#c4955f" stroke-width="2.2"/><path d="M8,22 q4,-6 8,0 t8,0 t8,0 t8,0" fill="#ffe39a"/><path d="M5,21 H43 Q41,41 24,43 Q7,41 5,21 Z" fill="#ffb3c8"/>'+face(24,31,.9),

function askConfirm(title,msg,ok,danger){return new Promise(function(res){var L=$('#confirmLayer');L.innerHTML='<div class="modal-back"><div class="dialog" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="btnrow"><button class="btn" id="cfNo">取消 Cancel</button><button class="btn '+(danger?'dangerfill':'pri')+'" id="cfYes">'+esc(ok||'確定 OK')+'</button></div></div></div>';
  $('#cfNo').onclick=function(){L.innerHTML='';res(false);};$('#cfYes').onclick=function(){L.innerHTML='';res(true);};setTimeout(function(){var y=$('#cfYes');if(y)y.focus();},30);});}
function promptAmount(title,msg,def){return new Promise(function(res){var L=$('#confirmLayer');L.innerHTML='<div class="modal-back"><div class="dialog"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="amtwrap"><span class="cur">$</span><input id="pAmt" inputmode="decimal" value="'+esc(def)+'"><span class="code">CAD</span></div><div class="btnrow"><button class="btn" id="pNo">取消 Cancel</button><button class="btn pri" id="pYes">儲存 Save</button></div></div></div>';var i=$('#pAmt');i.focus();i.select();
  function ok(){var v=parseAmt(i.value);if(!(v>=0)){i.parentNode.style.borderColor='red';return;}L.innerHTML='';res(r2(v));}
  i.addEventListener('keydown',function(e){if(e.key==='Enter')ok();});$('#pNo').onclick=function(){L.innerHTML='';res(null);};$('#pYes').onclick=ok;});}
function openModal(html,cls){$('#modalLayer').innerHTML='<div class="modal-back" data-back="1"><div class="sheet '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';document.body.style.overflow='hidden';}
function closeModal(){$('#modalLayer').innerHTML='';document.body.style.overflow='';F=null;}
function barCls(st){return st==='over'?'over':st==='warn'||st==='full'?'warn':'';}
function stBadge(x){
  if(x.st==='paid')return '<span class="badge ok">已付 Paid ✓</span>';
  if(x.st==='untouched')return '<span class="badge ok">未動用 Untouched ✓</span>';
  if(x.st==='over')return '<span class="badge over">超支 Over '+fmt(-x.remaining)+'</span>';
  if(x.st==='full')return '<span class="badge warn">剛好用完 100%</span>';
  if(x.st==='warn')return '<span class="badge warn">'+pct(x.pct)+' 快用完囉</span>';return '';}
function lineRow(x,c){
  var w=x.budget>0?Math.min(100,x.pct*100):(x.used>0?100:0);
  var h='<div class="prow" data-row="'+esc(x.id)+'"><div class="top"><span class="n">'+ic(x.icon,30)+'<span>'+lineNameH(x)+'</span></span><span class="num"><b>'+fmt(x.used)+'</b> <span class="muted">/ '+fmt(x.budget)+'</span></span></div>'+
  '<div class="bar '+barCls(x.st)+'"><i style="width:'+w.toFixed(1)+'%"></i></div>'+
  '<div class="bot"><span>'+(x.kind==='reserve'?'儲備金 Reserve · ':'')+(x.budget>0?pct(x.pct)+' used 已用':'—')+' '+stBadge(x)+'</span><span class="num '+(x.remaining<0?'neg':'')+'">'+(x.remaining<0?'超 Over ':'剩 Left ')+fmt(Math.abs(x.remaining))+'</span></div>';
  if(x.id==='L_util'&&x.cover>0)h+='<div class="note">'+ic('buf',18)+' 超出的 '+fmt(x.cover)+' 由水電緩衝支付 — covered by the buffer</div>';
  if(x.id==='L_buf'&&c&&c.cover>0)h+='<div class="note">Helping utilities 支援水電 '+fmt(c.cover)+'</div>';
  if(x.kind==='flex'&&c){h+='<div class="subchips">'+SUBS.map(function(s){var v=c.bySub[s[0]];return '<span class="subchip'+(v.amt>0?'':' zero')+'">'+ic(s[0],20)+esc(s[1])+' <b class="num">'+fmt0(v.amt)+'</b></span>';}).join('')+'</div>';}
  return h+'</div>';}
function entryItem(e){
  var inc=e._inc;
  if(inc){var so=SRC[e.source]||SRC.other;return '<li class="eitem" data-act="edit-inc" data-id="'+esc(e.id)+'"><div class="icw">'+ic('income',34)+'</div><div style="min-width:0"><div class="m">'+esc(so.zh)+' <span class="en">'+esc(so.en)+'</span> <span class="badge inc">額外收入 Extra</span></div><div class="s">'+dLabel(e.date)+(e.note?' · '+esc(e.note):'')+'</div></div><div class="a num pos">+'+fmt(e.amount)+'</div></li>';}
  return '<li class="eitem" data-act="edit-exp" data-id="'+esc(e.id)+'"><div class="icw">'+ic(entryIcon(e),34)+'</div><div style="min-width:0"><div class="m">'+entryNameH(e)+'</div><div class="s">'+dLabel(e.date)+(e.note?' · '+esc(e.note):'')+'</div></div><div class="a num">'+fmt(e.amount)+'</div></li>';}
function monthEntries(m){var a=S.expenses.filter(function(e){return monthOf(e.date)===m;}).map(function(e){return Object.assign({_inc:false},e);}).concat(S.incomes.filter(function(e){return monthOf(e.date)===m;}).map(function(e){return Object.assign({_inc:true},e);}));
  return a.sort(function(x,y){return x.date===y.date?((y.createdAt||'')>(x.createdAt||'')?1:-1):(x.date<y.date?1:-1);});}
function chipKeys(m){var a=SUBS.map(function(s){return {k:s[0],lineId:'L_flex',sub:s[0],icon:s[0],zh:s[1],en:s[2],flex:true};});
  var ord={L_groc:1,L_ttc:2,L_util:3,L_ins:4,L_buf:5};monthData(m).lines.filter(function(l){return l.kind!=='flex';}).slice().sort(function(x,y){return (ord[x.id]||9)-(ord[y.id]||9);}).forEach(function(l){a.push({k:l.id,lineId:l.id,sub:null,icon:l.icon,zh:l.zh,en:l.en});});return a;}
function keyOf(e){return e.lineId==='L_flex'?(SUB[e.sub]?e.sub:'other'):e.lineId;}
function greeting(c){
  if(!c.exps.length)return 'Hi Trinity! 嗨～ 點下面的小圖示記第一筆吧 ✨ Tap a chip to log your first spend.';
  if(c.remaining<0)return 'Oops，這個月超支 '+fmt(-c.remaining)+' — 沒關係，下個月再加油！💪 We bounce back next month.';
  if(c.overLines.length)return c.overLines[0].zh+' 超了一點點，小調整就好～ A tiny tweak and you’re back on track 🌷';
  if(c.spent/c.allowance>0.85)return '快到終點囉，慢慢花～ Almost there, easy does it 🌸';
  return '做得超好！Doing great ✨ 還有 '+fmt(c.remaining)+' 可以好好享受。';}
function bobaMoM(c,p){var d=c.bobaN-p.bobaN,da=r2(c.bobaAmt-p.bobaAmt);
  if(!c.bobaN&&!p.bobaN)return '這個月還沒喝奶茶 No boba yet — saving it for a treat? 🧋';
  var t='上月 Last month: '+p.bobaN+' 杯 · '+fmt(p.bobaAmt)+'<br>';
  if(d<0)t+='<b class="pos">比上月少 '+(-d)+' 杯 '+fmt(Math.abs(da))+' — nice! 🎉</b>';
  else if(d>0)t+='<b class="warnc">比上月多 '+d+' 杯 (+'+fmt(Math.abs(da))+') — enjoy, just peek at Flexible 👀</b>';
  else t+='<b>跟上月一樣 Same cups as last month '+(da?'('+(da>0?'+':'−')+fmt(Math.abs(da)).replace('−','')+')':'')+'</b>';
  return t;}
function cupsRow(n){var h='';for(var i=0;i<Math.min(n,12);i++)h+=ic('boba',26,'cup');if(n>12)h+='<span class="more">+'+(n-12)+'</span>';return h||'<span class="muted small">0 杯 — 🫧</span>';}
function niceMax(v){if(v<=0)return 10;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function barChart(rows,series,id,isMoney,Wd){
  var W=Wd||660,H=230,L=48,B=26,T=26,R=8,iw=W-L-R,ih=H-T-B,max=0;rows.forEach(function(r){r.vals.forEach(function(v){max=Math.max(max,v);});});max=niceMax(max);
  var s='<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var g=0;g<=4;g++){var y=T+ih-ih*g/4,v=max*g/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#5b4a5e" stroke-opacity=".08"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(isMoney?'$'+(v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)):Math.round(v*10)/10)+'</text>';}
  var gw=iw/Math.max(rows.length,1),bw=Math.min(24,gw*0.75/series.length);
  rows.forEach(function(r,i){var x0=L+gw*i+gw/2;r.vals.forEach(function(v,j){var h=Math.max(0,v)/max*ih,x=x0-bw*series.length/2+bw*j;s+='<rect x="'+x.toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="5" fill="'+series[j].color+'"><title>'+esc(r.label)+' '+series[j].name+': '+(isMoney?fmt(v):v)+'</title></rect>';});
    s+='<text x="'+x0.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(r.label)+'</text>';});
  var lx=L;series.forEach(function(se){s+='<rect x="'+lx+'" y="6" width="10" height="10" rx="3" fill="'+se.color+'"/><text x="'+(lx+14)+'" y="15">'+esc(se.name)+'</text>';lx+=se.name.length*7+34;});
  return s+'</svg>';}
function jarSVG(fill){fill=Math.max(0,Math.min(1,fill));var top=40+110*(1-fill);
  return '<svg class="jar" viewBox="0 0 120 170" width="96" height="136" aria-hidden="true"><defs><clipPath id="jarClip"><path d="M22,40 Q14,44 14,60 V146 Q14,162 30,162 H90 Q106,162 106,146 V60 Q106,44 98,40 Z"/></clipPath></defs><g filter="url(#handdrawn)"><rect x="30" y="16" width="60" height="18" rx="6" fill="#ffc2d9" stroke="#5b4a5e" stroke-width="2.2"/><path d="M22,40 Q14,44 14,60 V146 Q14,162 30,162 H90 Q106,162 106,146 V60 Q106,44 98,40 Z" fill="#f3f7ff" stroke="#5b4a5e" stroke-width="2.4"/><g clip-path="url(#jarClip)"><rect x="0" y="'+top.toFixed(1)+'" width="120" height="170" fill="#ffe58a"/>'+[[36,150],[58,152],[80,150],[47,138],[70,139],[92,138],[38,126],[60,125],[84,126]].filter(function(p){return p[1]>top+6;}).map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="#ffd34d" stroke="#e6b94a" stroke-width="1.6"/>';}).join('')+'</g><path d="M28,70 v50" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M40,34 h40" stroke="#5b4a5e" stroke-width="2"/></g><path d="M60,112 C48,103 46,96 50,92 C53,89 58,90 60,94 C62,90 67,89 70,92 C74,96 72,103 60,112Z" fill="#ff8fb1" stroke="#5b4a5e" stroke-width="1.8"/></svg>';}

/* ===================== RENDER & EVENTS ===================== */
function renderHeader(){
  $('#monthLabel').textContent=mLabel(ui.month);$('#monthLabelZh').textContent=mZh(ui.month);$('#monthPicker').value=ui.month;
  $$('#nav [data-v]').forEach(function(b){var on=b.getAttribute('data-v')===ui.view||(ui.view==='entries'&&b.getAttribute('data-v')==='home');b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}
function render(){
  var ae=document.activeElement,fid=ae&&ae.getAttribute&&ae.getAttribute('data-fid'),sel=null;try{sel=fid?ae.selectionStart:null;}catch(e){}
  renderHeader();
  $$('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+ui.view);});
  if(ui.view==='home')renderHome();else if(ui.view==='budget')renderBudget();else if(ui.view==='reports')renderReports();else if(ui.view==='more')renderMore();else if(ui.view==='entries')renderEntries();
  if(ui.view!=='reports')renderPrint(ui.repMonth||ui.month);
  if(fid){var el=document.querySelector('[data-fid="'+fid+'"]');if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
}
function setMonth(m){if(!/^\d{4}-\d{2}$/.test(m))return;ui.month=m;ensureMonth(m);ui.repMonth=m;render();}
function go(v,scrollId){ui.view=v;if(v==='reports')ui.repMonth=ui.month;render();if(scrollId){var el=document.getElementById(scrollId);if(el)el.scrollIntoView({block:'start'});}else window.scrollTo(0,0);}
function lineIdx(id){var L=S.months[ui.month].lines;for(var i=0;i<L.length;i++)if(L[i].id===id)return i;return -1;}
function lineChanged(msg){touchTemplate(ui.month);if(save())toast(msg||'已儲存 Saved ✓');}

    case 'add-inc':openEntry('inc',null,null);break;

      if(!F.amountStr&&F.key==='boba'){var q=quickAmts('boba');if(q.length){F.amountStr=String(q[0]);$('#fAmt').value=F.amountStr;}}updateQuick();updateLive();var a=$('#fAmt');if(a&&prevKey!==F.key){a.focus();}break;
    case 'f-src':readForm();F.source=v;$$('#srcChips .cchip').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===v);});updateLive();break;

    case 'edit-allow':var c=calc(ui.month);promptAmount('💌 零用錢 Monthly allowance','爸爸每月給的零用錢 (CAD) — '+mLabel(ui.month),c.allowance).then(function(a){if(a==null)return;ensureMonth(ui.month).allowance=a;lineChanged('零用錢已更新 Allowance saved ✓ '+fmt(a));render();});break;
    case 'line-add':ensureMonth(ui.month);var nl={id:uid('L'),zh:'新項目',en:'New line',amount:0,kind:'var',icon:'other'};S.months[ui.month].lines.push(nl);lineChanged('已新增項目 Line added ✓');render();var ni=$('[data-fid="lz-'+nl.id+'"]');if(ni){ni.focus();ni.select();ni.scrollIntoView({block:'center'});}break;
    case 'line-icon':var li0=lineIdx(id);if(li0<0)break;S.months[ui.month].lines[li0].icon=v;lineChanged();render();break;
    case 'line-del':var li=lineIdx(id),ln=S.months[ui.month].lines[li];var cnt=S.expenses.filter(function(e){return monthOf(e.date)===ui.month&&e.lineId===id;}).length;
      askConfirm('刪除項目？Delete line?',ln.zh+' '+ln.en+(cnt?'\n本月有 '+cnt+' 筆記錄用這個項目 — they will show as “unlinked”.':''),'刪除 Delete',true).then(function(ok){if(!ok)return;S.months[ui.month].lines.splice(lineIdx(id),1);lineChanged('已刪除 Deleted');render();});break;
    case 'copy-prev':var pm=addMonths(ui.month,-1);if(!S.months[pm]){toast(mLabel(pm)+' 沒有預算 No budget last month');break;}askConfirm('複製上月預算？Copy '+mLabel(pm)+' budget?','記錄不會被刪除 Entries are kept.','複製 Copy',false).then(function(ok){if(!ok)return;var P=S.months[pm];S.months[ui.month].lines=clone(P.lines);S.months[ui.month].allowance=P.allowance;lineChanged('已複製 Copied ✓');render();});break;
    case 'reset-lines':askConfirm('恢復預設項目？Reset to default lines?','房屋保險 28 · 水電 122 · 緩衝 35 · TTC 128 · 買菜 150 · 靈活 515\n記錄不會被刪除 Entries are kept.','恢復 Reset',true).then(function(ok){if(!ok)return;S.months[ui.month].lines=defaultLines();S.months[ui.month].allowance=978;lineChanged('已恢復預設 Defaults restored ✓');render();});break;
    case 'ent-filter':ui.entFilter=v||'';renderEntries();break;
    case 'gen-summary':showText('💌 給爸爸的小結 Summary for Dad',summaryText(ui.repMonth||ui.month),'sumText','<p class="small muted" style="margin-top:0">複製後貼到微信、LINE 或簡訊給爸爸 Copy & paste into WeChat / iMessage.</p>');break;
    case 'copy-ta':var ta=document.getElementById(t.getAttribute('data-target'));copyText(ta.value,ta);break;
    case 'xlsx-month':exportXlsx(ui.view==='reports'?(ui.repMonth||ui.month):ui.month);break;
    case 'xlsx-all':exportXlsx('all');break;
    case 'print':renderPrint(ui.repMonth||ui.month);toast('在列印視窗選「另存為 PDF」Choose “Save as PDF”');setTimeout(function(){window.print();},250);break;
    case 'export-dl':try{download(new Blob([exportJSON()],{type:'application/json'}),'Trinity-UofT-Budget-backup-'+todayStr()+'.json');toast('備份已下載 Backup downloaded ⬇️');}catch(err){toast('下載失敗，請用「複製 JSON」');}break;
    case 'export-copy':showText('📋 備份 JSON Backup',exportJSON(),'jsonOut','<p class="small muted" style="margin-top:0">複製並存到備忘錄或寄給自己。Save it in Notes or email it to yourself.</p>');break;
    case 'import-file':$('#importFile').value='';$('#importFile').click();break;
    case 'import-paste':openModal('<div class="sh"><h2>📥 貼上備份 Paste backup</h2><button class="xbtn" data-act="close-modal">×</button></div><textarea class="summary" id="pasteIn" placeholder="在此貼上 JSON… Paste here"></textarea><div class="foot"><button class="btn" data-act="close-modal">取消</button><button class="btn pri" data-act="import-go">驗證並匯入 Validate & import</button></div>');break;
    case 'import-go':doImport($('#pasteIn').value);break;
    case 'demo-load':askConfirm('載入示範資料？Load demo data?','會用 4 個月的示範資料覆蓋全部資料。Replaces ALL data with 4 months of sample data.','載入 Load',true).then(function(ok){if(!ok)return;S=buildDemo();save();ui.month=curMonth();go('home');toast('示範資料已載入 Demo loaded ✨');});break;
    case 'reset-all':askConfirm('全部重設？Reset everything?','所有記錄和設定都會刪除，請先備份！All entries & settings will be deleted.','重設 Reset',true).then(function(ok){if(!ok)return;S=freshData();save();ui.month=curMonth();go('home');toast('已重設 Reset ⟲');});break;

document.addEventListener('input',function(ev){var t=ev.target;if(F&&t.closest&&t.closest('.entsheet')&&(t.id==='fAmt'||t.id==='fNote'))updateLive();});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='monthPicker'&&t.value){setMonth(t.value);return;}
  if(t.id==='importFile'&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){doImport(String(rd.result));};rd.readAsText(t.files[0]);return;}
  if(t.id==='repMonth'){ui.repMonth=t.value;render();return;}
  if(t.id==='incToJar'){S.settings.incomeToJar=t.checked;save();render();toast(t.checked?'額外收入會存進存錢罐 Extra income → jar ✓':'額外收入另計 Kept separate ✓');return;}
  if(F&&t.closest&&t.closest('.entsheet')){if(t.id==='fDate'){readForm();renderForm();}else updateLive();return;}
  var mf=t.getAttribute('data-mf');
  if(mf){var a0=parseAmt(t.value),M=ensureMonth(ui.month);if(!(a0>=0)){toast('金額無效 Invalid amount');t.value=M[mf].toFixed(2);return;}M[mf]=r2(a0);lineChanged((mf==='rent'?'房租':'零用錢')+'已儲存 Saved ✓ '+fmt(a0));setTimeout(render,0);return;}
  var lf=t.getAttribute('data-lf');
  if(lf){var row=t.closest('[data-line]'),lid=row.getAttribute('data-line'),i=lineIdx(lid);if(i<0)return;var l=S.months[ui.month].lines[i];
    if(lf==='amount'){var a=parseAmt(t.value);if(!(a>=0)){toast('金額無效 Invalid amount');t.value=l.amount.toFixed(2);return;}l.amount=r2(a);}
    else{var nm=t.value.trim();if(!nm&&lf==='zh'){t.value=l.zh;return;}l[lf]=nm;}
    lineChanged('已儲存 Saved ✓ '+l.zh+(lf==='amount'?' '+fmt(l.amount):''));setTimeout(render,0);return;}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){if($('#confirmLayer').innerHTML)return;if($('#modalLayer').innerHTML)closeModal();return;}
  if(ev.key==='Enter'&&ev.target.getAttribute&&(ev.target.getAttribute('data-lf')||ev.target.getAttribute('data-mf'))){ev.target.blur();return;}
  if(ev.key==='Enter'&&F&&(ev.target.id==='fAmt'||ev.target.id==='fNote')){ev.preventDefault();saveEntry();return;}
  var tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||$('#modalLayer').innerHTML||$('#confirmLayer').innerHTML||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(ev.key==='n'||ev.key==='a'){ev.preventDefault();openEntry('exp',null,null);}
  else if(ev.key==='b'){ev.preventDefault();openEntry('exp',null,'boba');}
  else if(ev.key==='ArrowLeft')setMonth(addMonths(ui.month,-1));
  else if(ev.key==='ArrowRight')setMonth(addMonths(ui.month,1));
  else if(/^[1-4]$/.test(ev.key))go(['home','budget','reports','more'][+ev.key-1]);
});
window.addEventListener('storage',function(ev){if(ev.key===KEY){S=load();render();}});
